spring:
  application:
    name: eft-cepheid

  datasource:
    url: jdbc:postgresql://${POSTGRES:localhost:5432}/${DB_NAME:dev_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: ${DB_SCHEMA:eftcepheid}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:eftcepheid}
